version: "3.9"

# Üretim mimarisi:
# İnternet -> WAF (ModSecurity/Cloudflare) -> NGINX (TLS 1.3 sonlandırma)
#   -> FastAPI (bu compose) -> MySQL + Redis
# Mobil uygulama aynı API'yi TLS Pinning ile tüketir.

services:
  api:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    depends_on: [mysql, redis]
    networks: [internal]
    # Not: porta DIŞARIDAN doğrudan erişim YOK; yalnızca reverse proxy erişir.

  celery:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    command: celery -A app.worker worker --loglevel=info
    depends_on: [mysql, redis]
    networks: [internal]

  celery-beat:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    command: celery -A app.worker beat --loglevel=info
    depends_on: [redis]
    networks: [internal]

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: appApartman
      MYSQL_USER: app_user
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks: [internal]
    # Not: 3306 portu host'a açılmaz; yalnızca internal network.

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    networks: [internal]

volumes:
  mysql_data:

networks:
  internal:
    driver: bridge
